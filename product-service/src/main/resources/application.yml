server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
security:
  jwt:
    secret: ${JWT_SECRET:change-me-in-all-services-32-chars-minimum}
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true
springdoc:
  swagger-ui.path: /swagger-ui.html
