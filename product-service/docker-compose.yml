services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: product_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "3306:3306"
    volumes:
      - product_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root"]
      interval: 5s
      timeout: 3s
      retries: 20
  product-service:
    build: .
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-all-services-32-chars-minimum}
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  product_mysql_data:
